spring.application.name=AutoRent

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_autoRent}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Seguridad
jwt.secret=${JWT_SECRET:AutoRentClaveSecretaParaFirmarTokensJwtCambiarEnProduccion2026}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}

# Aplicacion
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://127.0.0.1:5500}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# APIs externas
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

geoapify.api-key=${GEOAPIFY_API_KEY:}
geoapify.autocomplete-url=https://api.geoapify.com/v1/geocode/autocomplete

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Imagenes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
