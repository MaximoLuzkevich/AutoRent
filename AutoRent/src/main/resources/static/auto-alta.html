<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Publicar auto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card auth-card-wide">
        <div class="auth-brand">
            <span class="brand-mark">AR</span>
            <div>
                <h1>AutoRent</h1>
                <p>Publicar o modificar auto</p>
            </div>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <form id="autoForm" class="auth-form">
            <div class="row g-3">
                <div class="col-12">
                    <label for="idAuto" class="form-label">ID auto para modificar</label>
                    <input id="idAuto" name="idAuto" type="number" class="form-control" min="1" placeholder="Dejalo vacio para publicar un auto nuevo">
                </div>
                <div class="col-md-6">
                    <label for="marca" class="form-label">Marca</label>
                    <input id="marca" name="marca" type="text" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="modelo" class="form-label">Modelo</label>
                    <input id="modelo" name="modelo" type="text" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-4">
                    <label for="anio" class="form-label">Anio</label>
                    <input id="anio" name="anio" type="number" class="form-control" min="1900" required>
                </div>
                <div class="col-md-4">
                    <label for="patente" class="form-label">Patente</label>
                    <input id="patente" name="patente" type="text" class="form-control" maxlength="20" required>
                </div>
                <div class="col-md-4">
                    <label for="color" class="form-label">Color</label>
                    <input id="color" name="color" type="text" class="form-control" maxlength="50">
                </div>
                <div class="col-md-4">
                    <label for="capacidadPasajeros" class="form-label">Pasajeros</label>
                    <input id="capacidadPasajeros" name="capacidadPasajeros" type="number" class="form-control" min="1" required>
                </div>
                <div class="col-md-4">
                    <label for="cantidadPuertas" class="form-label">Puertas</label>
                    <input id="cantidadPuertas" name="cantidadPuertas" type="number" class="form-control" min="1" required>
                </div>
                <div class="col-md-4">
                    <label for="precioDia" class="form-label">Precio por dia</label>
                    <input id="precioDia" name="precioDia" type="number" class="form-control" min="1" step="0.01" required>
                </div>
                <div class="col-md-4">
                    <label for="transmision" class="form-label">Transmision</label>
                    <select id="transmision" name="transmision" class="form-select" required>
                        <option value="MANUAL">Manual</option>
                        <option value="AUTOMATICA">Automatica</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="combustible" class="form-label">Combustible</label>
                    <select id="combustible" name="combustible" class="form-select" required>
                        <option value="NAFTA">Nafta</option>
                        <option value="DIESEL">Diesel</option>
                        <option value="ELECTRICO">Electrico</option>
                        <option value="HIBRIDO">Hibrido</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="categoria" class="form-label">Categoria</label>
                    <select id="categoria" name="categoria" class="form-select" required>
                        <option value="ECONOMICO">Economico</option>
                        <option value="PREMIUM">Premium</option>
                        <option value="SUV">SUV</option>
                        <option value="ELECTRICO">Electrico</option>
                        <option value="UTILITARIO">Utilitario</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input id="ciudad" name="ciudad" type="text" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="provincia" class="form-label">Provincia</label>
                    <input id="provincia" name="provincia" type="text" class="form-control" maxlength="100">
                </div>
                <div class="col-12">
                    <label for="direccionRetiro" class="form-label">Direccion de retiro</label>
                    <input id="direccionRetiro" name="direccionRetiro" type="text" class="form-control" maxlength="150" required>
                </div>
                <div class="col-12">
                    <label for="descripcion" class="form-label">Descripcion</label>
                    <textarea id="descripcion" name="descripcion" class="form-control" rows="3"></textarea>
                </div>
            </div>

            <button class="btn btn-primary w-100 mt-4" type="submit">Guardar auto</button>
        </form>

        <hr class="my-4">

        <form id="imagenForm" class="auth-form">
            <h2 class="h5 mb-3">Agregar imagen al auto</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="idAutoImagen" class="form-label">ID auto</label>
                    <input id="idAutoImagen" name="idAuto" type="number" class="form-control" min="1" required>
                </div>
                <div class="col-md-8">
                    <label for="nombreArchivo" class="form-label">Nombre</label>
                    <input id="nombreArchivo" name="nombreArchivo" type="text" class="form-control" maxlength="255" placeholder="corolla-frente.jpg" required>
                </div>
                <div class="col-12">
                    <label for="urlImagen" class="form-label">URL de imagen</label>
                    <input id="urlImagen" name="urlImagen" type="url" class="form-control" maxlength="500" placeholder="https://..." required>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input id="principal" name="principal" class="form-check-input" type="checkbox">
                        <label for="principal" class="form-check-label">Marcar como imagen principal</label>
                    </div>
                </div>
            </div>

            <button class="btn btn-outline-primary w-100 mt-4" type="submit">Agregar imagen</button>
        </form>

        <p class="auth-link"><a id="volverPanel" href="panel-propietario.html">Volver al panel</a></p>
    </section>
</main>
<script src="js/forms.js"></script>
</body>
</html>
