<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-view="perfil">
<div id="appNavbar"></div>

<main class="app-container narrow-container">
    <div class="page-heading clean-heading">
        <div>
            <span>Cuenta</span>
            <h1>Mi perfil</h1>
        </div>
    </div>
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <section class="form-surface">
        <p class="profile-roles">Roles: <strong id="perfilRoles"></strong></p>
        <form id="perfilForm" class="form-grid one-col">
            <div>
                <label class="form-label" for="nombre">Nombre</label>
                <input class="form-control" id="nombre" name="nombre" type="text" required>
            </div>
            <div>
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" required>
            </div>
            <div>
                <label class="form-label" for="telefono">Telefono</label>
                <input class="form-control" id="telefono" name="telefono" type="text">
            </div>
            <div class="form-actions spread-actions">
                <button id="bajaPerfil" class="btn btn-outline-danger" type="button">Dar de baja perfil</button>
                <button class="btn btn-primary" type="submit">Guardar cambios</button>
            </div>
        </form>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
