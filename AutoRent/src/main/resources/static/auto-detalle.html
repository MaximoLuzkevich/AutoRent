<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Ficha del auto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-view="auto-detail">
<div id="appNavbar"></div>

<main class="app-container">
    <div class="page-heading clean-heading">
        <div>
            <span>Ficha del auto</span>
            <h1>Detalle y reserva</h1>
        </div>
        <a class="btn btn-outline-primary" href="cliente-inicio.html">Volver al inicio</a>
    </div>
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <div id="autoDetail"></div>

    <section class="action-band">
        <div>
            <span>Reserva</span>
            <h2>Elegir fechas</h2>
            <p>Si llegaste desde el buscador, las fechas ya quedan cargadas.</p>
        </div>
        <form id="reservaForm" class="inline-form">
            <input class="form-control" id="fechaInicio" name="fechaInicio" type="date" required>
            <input class="form-control" id="fechaFin" name="fechaFin" type="date" required>
            <button class="btn btn-primary" type="submit">Reservar</button>
        </form>
    </section>

    <section id="autoReviews" class="fleet-section"></section>
</main>

<script src="js/app.js"></script>
</body>
</html>
