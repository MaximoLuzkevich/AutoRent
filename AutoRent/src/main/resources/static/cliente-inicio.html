<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="customer-home" data-view="home">
<div id="appNavbar"></div>

<main>
    <section class="home-hero">
        <div class="hero-content">
            <div class="hero-kicker">Alquiler de autos</div>
            <h1>Alquila tu auto <span>ideal</span></h1>
            <p>Busca por ciudad, elegi las fechas y reserva el auto que mejor se adapte a tu viaje.</p>
            <a class="btn btn-primary btn-lg" href="#buscar">Reservar ahora</a>
            <div class="hero-rating">
                <strong>4.8/5</strong>
                <span>Reservas seguras y pagos registrados</span>
            </div>
        </div>
    </section>

    <section id="buscar" class="home-search-wrap">
        <div class="home-search-card">
            <div class="search-title">
                <span class="search-icon">AR</span>
                <h2>Busca tu auto</h2>
            </div>
            <form id="searchForm">
                <div class="home-search-grid">
                    <div>
                        <label class="form-label" for="ciudad">Ciudad de retiro</label>
                        <div class="autocomplete-wrap">
                            <input class="form-control" id="ciudad" name="ciudad" type="text" autocomplete="off" required>
                            <div id="citySuggestions" class="autocomplete-list d-none"></div>
                        </div>
                    </div>
                    <div>
                        <label class="form-label" for="fechaInicio">Fecha de retiro</label>
                        <input class="form-control" id="fechaInicio" name="fechaInicio" type="date" required>
                    </div>
                    <div>
                        <label class="form-label" for="fechaFin">Fecha de devolucion</label>
                        <input class="form-control" id="fechaFin" name="fechaFin" type="date" required>
                    </div>
                    <div>
                        <label class="form-label" for="categoria">Categoria</label>
                        <select class="form-select" id="categoria" name="categoria">
                            <option value="">Todas</option>
                            <option value="ECONOMICO">Economico</option>
                            <option value="PREMIUM">Premium</option>
                            <option value="SUV">SUV</option>
                            <option value="ELECTRICO">Electrico</option>
                            <option value="UTILITARIO">Utilitario</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" type="submit">Buscar autos</button>
                </div>
            </form>
            <div class="search-benefits">
                <span>Reservas con estado claro</span>
                <span>Pagos por tarjeta o Mercado Pago</span>
                <span>Reviews de clientes</span>
            </div>
        </div>
    </section>

    <div class="app-container">
        <div id="mensaje" class="alert d-none" role="alert"></div>
        <div id="searchResults"></div>
        <div id="homeCars"></div>
    </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
