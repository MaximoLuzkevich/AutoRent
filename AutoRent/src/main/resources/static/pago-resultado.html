<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Resultado de pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page">
<main class="app-container narrow-container">
    <section class="form-surface text-center">
        <span class="badge-soft" id="paymentStatusBadge">Pago</span>
        <h1 class="mt-3" id="paymentStatusTitle">Procesando pago</h1>
        <p class="text-muted" id="paymentStatusText">
            Si pagaste con Mercado Pago, AutoRent actualiza el estado cuando Mercado Pago confirma la operacion.
        </p>
        <div class="form-actions justify-content-center">
            <a class="btn btn-primary" href="cliente-pagos.html">Ver mis pagos</a>
            <a class="btn btn-outline-primary" href="cliente-reservas.html">Ver mis reservas</a>
        </div>
    </section>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const estado = params.get("estado");
    const paymentId = params.get("payment_id") || params.get("collection_id");
    const titulo = document.getElementById("paymentStatusTitle");
    const texto = document.getElementById("paymentStatusText");
    const badge = document.getElementById("paymentStatusBadge");

    const mensajes = {
        aprobado: ["Pago aprobado", "Mercado Pago aprobo la operacion. La reserva se confirma cuando el webhook llega al backend.", "Aprobado"],
        pendiente: ["Pago pendiente", "Mercado Pago dejo la operacion pendiente. Podes revisar el estado desde Mis pagos.", "Pendiente"],
        rechazado: ["Pago rechazado", "Mercado Pago no aprobo la operacion. Podes intentar registrar otro pago.", "Rechazado"]
    };

    const mensaje = mensajes[estado] || ["Resultado de pago", "Revisa el estado actualizado desde Mis pagos.", "Pago"];
    titulo.textContent = mensaje[0];
    texto.textContent = mensaje[1];
    badge.textContent = mensaje[2];

    confirmarPago();

    async function confirmarPago() {
        const token = localStorage.getItem("autorent_token");
        if (!paymentId || !token) {
            return;
        }

        try {
            const response = await fetch(`/api/pagos/mercadopago/retorno?payment_id=${encodeURIComponent(paymentId)}`, {
                method: "POST",
                headers: {
                    Accept: "application/json",
                    Authorization: `Bearer ${token}`
                }
            });

            if (!response.ok) {
                return;
            }

            const pago = await response.json();
            badge.textContent = pago.estado;
            titulo.textContent = pago.estado === "APROBADO" ? "Pago aprobado" : "Pago actualizado";
            texto.textContent = `El pago #${pago.idPago} quedo en estado ${pago.estado}.`;
        } catch (error) {
            // El webhook tambien puede actualizar el pago. Si este intento falla, el usuario puede revisar Mis pagos.
        }
    }
</script>
</body>
</html>
