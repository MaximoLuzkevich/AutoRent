<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Mi auto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-view="propietario-auto-detail">
<div id="appNavbar"></div>

<main class="app-container">
    <div class="page-heading clean-heading">
        <div>
            <span>Propietario</span>
            <h1>Ficha de mi auto</h1>
            <p>Desde esta vista podes modificar la publicacion o darla de baja.</p>
        </div>
        <a class="btn btn-outline-primary" href="propietario-autos.html">Volver a mis autos</a>
    </div>
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <div id="ownerAutoDetail"></div>

    <section class="form-surface mt-4">
        <div class="section-heading">
            <div>
                <span>Editar publicacion</span>
                <h2>Datos del vehiculo</h2>
            </div>
        </div>
        <form id="ownerAutoForm" class="form-grid">
            <div>
                <label class="form-label">Marca</label>
                <input class="form-control" name="marca" type="text" required>
            </div>
            <div>
                <label class="form-label">Modelo</label>
                <input class="form-control" name="modelo" type="text" required>
            </div>
            <div>
                <label class="form-label">Anio</label>
                <input class="form-control" name="anio" type="number" min="1900" required>
            </div>
            <div>
                <label class="form-label">Patente</label>
                <input class="form-control" name="patente" type="text" required>
            </div>
            <div>
                <label class="form-label">Color</label>
                <input class="form-control" name="color" type="text">
            </div>
            <div>
                <label class="form-label">Pasajeros</label>
                <input class="form-control" name="capacidadPasajeros" type="number" min="1" required>
            </div>
            <div>
                <label class="form-label">Puertas</label>
                <input class="form-control" name="cantidadPuertas" type="number" min="1" required>
            </div>
            <div>
                <label class="form-label">Precio por dia</label>
                <input class="form-control" name="precioDia" type="number" min="1" step="0.01" required>
            </div>
            <div>
                <label class="form-label">Transmision</label>
                <select class="form-select" name="transmision" required>
                    <option value="MANUAL">Manual</option>
                    <option value="AUTOMATICA">Automatica</option>
                </select>
            </div>
            <div>
                <label class="form-label">Combustible</label>
                <select class="form-select" name="combustible" required>
                    <option value="NAFTA">Nafta</option>
                    <option value="DIESEL">Diesel</option>
                    <option value="ELECTRICO">Electrico</option>
                    <option value="HIBRIDO">Hibrido</option>
                </select>
            </div>
            <div>
                <label class="form-label">Categoria</label>
                <select class="form-select" name="categoria" required>
                    <option value="ECONOMICO">Economico</option>
                    <option value="PREMIUM">Premium</option>
                    <option value="SUV">SUV</option>
                    <option value="ELECTRICO">Electrico</option>
                    <option value="UTILITARIO">Utilitario</option>
                </select>
            </div>
            <div>
                <label class="form-label">Ciudad</label>
                <input class="form-control" name="ciudad" type="text" required>
            </div>
            <div>
                <label class="form-label">Provincia</label>
                <input class="form-control" name="provincia" type="text" required>
            </div>
            <div>
                <label class="form-label">Direccion de retiro</label>
                <input class="form-control" name="direccionRetiro" type="text" required>
            </div>
            <div class="wide-field">
                <label class="form-label">Descripcion</label>
                <textarea class="form-control" name="descripcion" rows="4"></textarea>
            </div>
            <div class="wide-field form-actions spread-actions">
                <button id="deleteOwnerAuto" class="btn btn-outline-danger" type="button">Dar de baja auto</button>
                <button class="btn btn-primary" type="submit">Guardar cambios</button>
            </div>
        </form>
    </section>

    <section class="form-surface mt-4">
        <div class="section-heading">
            <div>
                <span>Imagenes</span>
                <h2>Fotos del auto</h2>
            </div>
        </div>
        <form id="ownerImageForm" class="form-grid">
            <div>
                <label class="form-label" for="ownerImageFile">Imagen</label>
                <input id="ownerImageFile" class="form-control" name="file" type="file" accept="image/*" multiple required>
            </div>
            <div class="form-check align-self-end">
                <input id="ownerImagePrincipal" class="form-check-input" name="principal" type="checkbox">
                <label class="form-check-label fw-semibold" for="ownerImagePrincipal">Marcar como principal</label>
            </div>
            <button class="btn btn-outline-primary" type="submit">Subir imagen</button>
        </form>
        <div id="ownerImagesList" class="image-preview-grid mt-3"></div>
    </section>

    <section id="ownerAutoReviews" class="fleet-section"></section>
</main>

<script src="js/app.js"></script>
</body>
</html>
