<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark">AR</span>
            <div>
                <h1>AutoRent</h1>
                <p>Registro</p>
            </div>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <form id="registroForm" class="auth-form">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" name="nombre" type="text" class="form-control" autocomplete="name" maxlength="100" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email" maxlength="150" required>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Telefono</label>
                <input id="telefono" name="telefono" type="text" class="form-control" autocomplete="tel" maxlength="30">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" minlength="6" maxlength="100" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
        </form>

        <p class="auth-link">Ya tenes cuenta? <a href="login.html">Iniciar sesion</a></p>
    </section>
</main>
<script src="js/auth.js"></script>
</body>
</html>
