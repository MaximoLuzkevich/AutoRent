<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Iniciar sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark">AR</span>
            <div>
                <h1>AutoRent</h1>
                <p>Iniciar sesion</p>
            </div>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <form id="loginForm" class="auth-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>

        <p class="auth-link">No tenes cuenta? <a href="registro.html">Registrarse</a></p>
    </section>
</main>
<script src="js/auth.js"></script>
</body>
</html>
