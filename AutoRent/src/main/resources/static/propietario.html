<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Ser propietario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="auth-shell">
    <section class="auth-card auth-card-wide">
        <div class="auth-brand">
            <span class="brand-mark">AR</span>
            <div>
                <h1>AutoRent</h1>
                <p>Datos de propietario</p>
            </div>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <form id="propietarioForm" class="auth-form">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="dni" class="form-label">DNI</label>
                    <input id="dni" name="dni" type="text" class="form-control" maxlength="30">
                </div>
                <div class="col-md-6">
                    <label for="cuit" class="form-label">CUIT</label>
                    <input id="cuit" name="cuit" type="text" class="form-control" maxlength="30">
                </div>
                <div class="col-12">
                    <label for="direccion" class="form-label">Direccion</label>
                    <input id="direccion" name="direccion" type="text" class="form-control" maxlength="150">
                </div>
                <div class="col-md-6">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input id="ciudad" name="ciudad" type="text" class="form-control" maxlength="100">
                </div>
                <div class="col-md-6">
                    <label for="provincia" class="form-label">Provincia</label>
                    <input id="provincia" name="provincia" type="text" class="form-control" maxlength="100">
                </div>
            </div>

            <button class="btn btn-primary w-100 mt-4" type="submit">Convertirme en propietario</button>
        </form>

        <p class="auth-link"><a id="volverPanel" href="panel-cliente.html">Volver al panel</a></p>
    </section>
</main>
<script src="js/forms.js"></script>
</body>
</html>
