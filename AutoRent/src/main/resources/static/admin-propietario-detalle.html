<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Perfil propietario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-view="admin-propietario-detalle">
<div id="appNavbar"></div>

<main class="app-container narrow-container">
    <div class="page-heading clean-heading">
        <div>
            <span>Administrador</span>
            <h1 id="ownerTitle">Propietario</h1>
            <p id="ownerMeta"></p>
        </div>
        <a class="btn btn-outline-primary" href="admin-propietarios.html">Volver</a>
    </div>
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <section class="form-surface">
        <form id="adminOwnerDetailForm" class="form-grid one-col">
            <div>
                <label class="form-label">DNI</label>
                <input class="form-control" name="dni" type="text">
            </div>
            <div>
                <label class="form-label">CUIT</label>
                <input class="form-control" name="cuit" type="text">
            </div>
            <div>
                <label class="form-label">Direccion</label>
                <input class="form-control" name="direccion" type="text">
            </div>
            <div>
                <label class="form-label">Ciudad</label>
                <input class="form-control" name="ciudad" type="text" required>
            </div>
            <div>
                <label class="form-label">Provincia</label>
                <input class="form-control" name="provincia" type="text" required>
            </div>
            <div class="form-actions spread-actions">
                <button id="deleteOwner" class="btn btn-outline-danger" type="button">Dar de baja</button>
                <div class="d-flex gap-2">
                    <button id="verifyOwner" class="btn btn-outline-success" type="button">Verificar</button>
                    <button class="btn btn-primary" type="submit">Guardar cambios</button>
                </div>
            </div>
        </form>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
