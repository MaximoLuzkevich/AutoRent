<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Datos propietario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-view="propietario-perfil">
<div id="appNavbar"></div>

<main class="app-container narrow-container">
    <div class="page-heading clean-heading">
        <div>
            <span>Propietario</span>
            <h1>Mis datos de propietario</h1>
            <p id="propietarioPerfilEstado"></p>
        </div>
    </div>
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <section class="form-surface">
        <form id="propietarioPerfilForm" class="form-grid one-col">
            <div>
                <label class="form-label">DNI</label>
                <input class="form-control" name="dni" type="text" maxlength="30">
            </div>
            <div>
                <label class="form-label">CUIT</label>
                <input class="form-control" name="cuit" type="text" maxlength="30">
            </div>
            <div>
                <label class="form-label">Direccion</label>
                <input class="form-control" name="direccion" type="text" maxlength="150">
            </div>
            <div>
                <label class="form-label">Ciudad</label>
                <input class="form-control" name="ciudad" type="text" maxlength="100" required>
            </div>
            <div>
                <label class="form-label">Provincia</label>
                <input class="form-control" name="provincia" type="text" maxlength="100" required>
            </div>
            <button class="btn btn-primary" type="submit">Guardar datos</button>
        </form>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
