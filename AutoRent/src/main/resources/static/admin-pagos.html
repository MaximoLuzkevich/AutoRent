<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Pagos admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-view="admin-pagos">
<div id="appNavbar"></div>

<main class="app-container">
    <div class="page-heading clean-heading">
        <div>
            <span>Administrador</span>
            <h1>Historial de pagos</h1>
        </div>
        <form id="adminPaymentsFilter" class="inline-form compact-form">
            <select class="form-select" name="estado">
                <option value="">Todos</option>
                <option value="PENDIENTE">Pendientes</option>
                <option value="APROBADO">Aprobados</option>
                <option value="RECHAZADO">Rechazados</option>
            </select>
            <button class="btn btn-outline-primary" type="submit">Filtrar</button>
        </form>
    </div>
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <section id="adminPayments" class="stack-list"></section>
</main>

<script src="js/app.js"></script>
</body>
</html>
