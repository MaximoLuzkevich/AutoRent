<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoRent - Mis reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-view="reservas">
<div id="appNavbar"></div>

<main class="app-container">
    <div class="page-heading clean-heading">
        <div>
            <span>Cliente</span>
            <h1>Mis reservas</h1>
        </div>
        <form id="reservasFiltro" class="inline-form compact-form">
            <select class="form-select" name="estado">
                <option value="">Todas</option>
                <option value="PENDIENTE">Pendientes</option>
                <option value="CONFIRMADA">Confirmadas</option>
                <option value="CANCELADA">Canceladas</option>
                <option value="FINALIZADA">Finalizadas</option>
            </select>
            <button class="btn btn-outline-primary" type="submit">Filtrar</button>
        </form>
    </div>
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <section id="reservasList" class="stack-list"></section>

    <section id="reviewSection" class="form-surface d-none">
        <div class="section-heading">
            <div>
                <span>Reviews</span>
                <h2>Agregar review</h2>
                <p class="text-muted mb-0">Auto seleccionado: <strong id="reviewAutoLabel"></strong></p>
            </div>
        </div>
        <form id="reviewForm" class="form-grid">
            <input name="idAuto" type="hidden">
            <div>
                <label class="form-label">Puntuacion</label>
                <select class="form-select" name="puntuacion" required>
                    <option value="5">5</option>
                    <option value="4">4</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1</option>
                </select>
            </div>
            <div class="wide-field">
                <label class="form-label">Comentario</label>
                <textarea class="form-control" name="comentario" rows="3"></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Guardar review</button>
        </form>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
